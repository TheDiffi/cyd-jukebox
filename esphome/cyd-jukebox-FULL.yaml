        min_value: 0
        max_value: 100
        on_value:
        - if:
            condition:
              lambda: return id(vol_mode);
            then:
            - homeassistant.service:
                service: media_player.volume_set
                data:
                  entity_id: "${media_player_entity}"
                  volume_level: !lambda "return x / 100.0f;"
        - script.execute: vol_mode_timeout
        bg_color: 2042167
        bg_opa: COVER
        radius: 0
        border_width: 2
        border_color: 3355443
        border_opa: COVER
        pad_top: 0
        pad_bottom: 0
        indicator:
          bg_color: 3355443
          bg_opa: COVER
          radius: 0
        knob:
          bg_color: 16777215
          bg_opa: COVER
          radius: 0
          border_width: 2
          border_color: 0
          border_opa: COVER
          pad_all: 4
    - obj:
        id: lv_mood_overlay
        x: 0
        y: 60
        width: 236
        height: 70
        bg_color: 0
        bg_opa: 70%
        radius: 0
        border_width: 0
        widgets:
        - label:
            id: lv_mood_label
            width: 236
            long_mode: SCROLL
            text: ""
            text_font: font_large
            align: CENTER
  - id: canvas_playlists
