  - id: canvas_idle
    bg_color: 0
    scrollbar_mode: 'OFF'
    scroll_dir: NONE
    widgets:
    - button:
        id: btn_idle_play
        x: 0
        y: 0
        width: 240
        height: 320
        bg_opa: TRANSP
        border_width: 0
        on_click:
        - homeassistant.service:
            service: media_player.media_play
            data:
              entity_id: "${media_player_entity}"
        - script.stop: idle_sleep_timer
        widgets:
        - image:
            src: icon_play_large
            styles: icon_bright
