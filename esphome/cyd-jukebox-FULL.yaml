substitutions:
  media_player_entity: media_player.your_player
  ha_url: http://homeassistant.local:8123
  device_name: cyd-jukebox
  friendly_name: CYD Jukebox
  quickplay_button_chill_playlist_id: library://playlist/15
  quickplay_button_pop_playlist_id: library://playlist/16
  cover_camera_entity: camera.your_player_cover
external_components:
- source: github://TheDiffi/cyd-jukebox@master
  components:
  - cover_art
esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  min_version: 2025.11.0
  name_add_mac_suffix: false
  on_boot:
  - lambda: "struct Corner { int size; const char *cells; };\nstatic const Corner\
      \ SMALL = {2, \"x.\"\n                                \".#\"};\nstatic const\
      \ Corner LARGE = {3, \"xxx\"\n                                \"x##\"\n    \
      \                            \"x#.\"};\nstatic auto notch_corners = [](lv_event_t\
      \ *e) {\n  lv_obj_t *obj = lv_event_get_target(e);\n  const auto *pattern =\
      \ static_cast<const Corner *>(lv_event_get_user_data(e));\n  const lv_coord_t\
      \ px = lv_obj_get_style_border_width(obj, LV_PART_MAIN);\n  if (px <= 0)\n \
      \   return;\n  lv_draw_ctx_t *ctx = lv_event_get_draw_ctx(e);\n  lv_draw_rect_dsc_t\
      \ cut;\n  lv_draw_rect_dsc_init(&cut);\n  cut.bg_color = lv_color_black(); \
      \ // the page background\n  lv_draw_rect_dsc_t step = cut;\n  step.bg_color\
      \ = lv_obj_get_style_border_color(obj, LV_PART_MAIN);\n  const lv_area_t &c\
      \ = obj->coords;\n  for (int corner = 0; corner != 4; corner++) {\n    const\
      \ bool right = corner & 1, bottom = corner & 2;\n    for (int row = 0; row !=\
      \ pattern->size; row++) {\n      for (int col = 0; col != pattern->size; col++)\
      \ {\n        const char cell = pattern->cells[row * pattern->size + col];\n\
      \        if (cell == '.')\n          continue;\n        const lv_coord_t x =\
      \ right ? c.x2 - (col + 1) * px + 1 : c.x1 + col * px;\n        const lv_coord_t\
      \ y = bottom ? c.y2 - (row + 1) * px + 1 : c.y1 + row * px;\n        lv_area_t\
      \ area = {x, y, (lv_coord_t) (x + px - 1), (lv_coord_t) (y + px - 1)};\n   \
      \     lv_draw_rect(ctx, cell == 'x' ? &cut : &step, &area);\n      }\n    }\n\
      \  }\n};\n// The main row gets the rounder corners\nstd::function<void(lv_obj_t\
      \ *)> add_to_buttons = [&](lv_obj_t *obj) {\n  if (lv_obj_check_type(obj, &lv_btn_class))\
      \ {\n    const bool main_row = obj == id(btn_vol) || obj == id(btn_play_pause)\
      \ || obj == id(btn_skip);\n    lv_obj_add_event_cb(obj, notch_corners, LV_EVENT_DRAW_MAIN_END,\n\
      \                        (void *) (main_row ? &LARGE : &SMALL));\n  }\n  for\
      \ (uint32_t i = 0; i != lv_obj_get_child_cnt(obj); i++)\n    add_to_buttons(lv_obj_get_child(obj,\
      \ i));\n};\nfor (auto *page : {id(canvas_1), id(canvas_playlists), id(canvas_idle)})\n\
      \  add_to_buttons(page->obj);"
esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: '3.1'
psram: null
logger: null
api:
  encryption:
    key: !secret api_key
ota:
- platform: esphome
  password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
time:
- platform: homeassistant
  id: ha_time
  on_time:
  - hours: 2,3,4,5
    minutes: 5
    seconds: 0
    then:
    - switch.turn_on: switch_antiburn
  - hours: 2,3,4,5
    minutes: 35
    seconds: 0
    then:
    - switch.turn_off: switch_antiburn
switch:
- platform: template
  name: Antiburn
  id: switch_antiburn
  icon: mdi:television-shimmer
  optimistic: true
  entity_category: config
  restore_mode: ALWAYS_OFF
  turn_on_action:
  - if:
      condition: lvgl.is_paused
      then:
      - lvgl.resume: null
      - lvgl.widget.redraw: null
  - lvgl.pause:
      show_snow: true
  turn_off_action:
  - if:
      condition: lvgl.is_paused
      then:
      - lvgl.resume: null
      - lvgl.widget.redraw: null
font:
- file:
    type: gfonts
    family: Montserrat
  id: font_large
  size: 32
  bpp: 4
- file:
    type: gfonts
    family: Montserrat
  id: font_small
  size: 18
  bpp: 4
image:
- id: icon_play
  file: https://raw.githubusercontent.com/TheDiffi/cyd-jukebox/master/esphome/icons/play.png
  type: BINARY
- id: icon_play_large
  file: https://raw.githubusercontent.com/TheDiffi/cyd-jukebox/master/esphome/icons/play-large.png
  type: BINARY
- id: icon_pause
  file: https://raw.githubusercontent.com/TheDiffi/cyd-jukebox/master/esphome/icons/pause.png
  type: BINARY
- id: icon_skip
  file: https://raw.githubusercontent.com/TheDiffi/cyd-jukebox/master/esphome/icons/skip-next.png
  type: BINARY
- id: icon_volume
  file: https://raw.githubusercontent.com/TheDiffi/cyd-jukebox/master/esphome/icons/volume.png
  type: BINARY
- id: icon_music_note
  file: https://raw.githubusercontent.com/TheDiffi/cyd-jukebox/master/esphome/icons/music-note.png
  type: BINARY
- id: icon_arrow_left_box
  file: https://raw.githubusercontent.com/TheDiffi/cyd-jukebox/master/esphome/icons/arrow-left-box.png
  type: BINARY
- id: icon_cloud_small
  file: https://raw.githubusercontent.com/TheDiffi/cyd-jukebox/master/esphome/icons/cloud-small.png
  type: BINARY
- id: icon_music_note_small
  file: https://raw.githubusercontent.com/TheDiffi/cyd-jukebox/master/esphome/icons/music-note-small.png
  type: BINARY
- id: icon_arrow_right_small
  file: https://raw.githubusercontent.com/TheDiffi/cyd-jukebox/master/esphome/icons/arrow-right-small.png
  type: BINARY
- id: icon_power_small
  file: https://raw.githubusercontent.com/TheDiffi/cyd-jukebox/master/esphome/icons/power-small.png
  type: BINARY
globals:
- id: media_active
  type: bool
  restore_value: false
  initial_value: 'false'
- id: vol_mode
  type: bool
  restore_value: false
  initial_value: 'false'
- id: is_sleeping
  type: bool
  restore_value: false
  initial_value: 'false'
- id: is_dimmed
  type: bool
  restore_value: false
  initial_value: 'false'
- id: switching_playlist
  type: bool
  restore_value: false
  initial_value: 'false'
script:
- id: render_vol_ui
  then:
  - if:
      condition:
        lambda: return id(vol_mode);
      then:
      - lvgl.widget.hide:
          id: btn_mood_1
      - lvgl.widget.hide:
          id: btn_mood_2
      - lvgl.widget.hide:
          id: btn_open_playlists
      - lvgl.widget.show:
          id: lv_vol_slider
      - lvgl.image.update:
          id: lv_vol_icon
          src: icon_music_note
      - script.execute: vol_mode_timeout
      else:
      - lvgl.widget.show:
          id: btn_mood_1
      - lvgl.widget.show:
          id: btn_mood_2
      - lvgl.widget.show:
          id: btn_open_playlists
      - lvgl.widget.hide:
          id: lv_vol_slider
      - lvgl.image.update:
          id: lv_vol_icon
          src: icon_volume
      - script.stop: vol_mode_timeout
- id: vol_mode_timeout
  mode: restart
  then:
  - delay: 10s
  - globals.set:
      id: vol_mode
      value: 'false'
  - script.execute: render_vol_ui
- id: idle_sleep_timer
  mode: restart
  then:
  - delay: 10s
  - lvgl.pause:
      show_snow: true
  - globals.set:
      id: is_sleeping
      value: 'true'
  - delay: 500ms
  - light.turn_off: backlight
- id: idle_dim_timer
  mode: restart
  then:
  - delay: 30s
  - if:
      condition:
        lambda: return !id(is_sleeping) && id(mp_state).state != "playing";
      then:
      - light.turn_on:
          id: backlight
          brightness: 50%
      - globals.set:
          id: is_dimmed
          value: 'true'
- id: fetch_cover
  mode: restart
  then:
  - delay: 300ms
  - cover_art.fetch: cover
- id: select_playlist
  mode: restart
  parameters:
    popup_text: string
    media_id: string
  then:
  - globals.set:
      id: switching_playlist
      value: 'true'
  - lvgl.label.update:
      id: lv_mood_label
      text: !lambda "return popup_text.c_str();"
  - lambda: lv_obj_set_style_opa(id(lv_mood_overlay), LV_OPA_COVER, 0);
  - lvgl.widget.show: lv_mood_overlay
  - homeassistant.service:
      service: music_assistant.play_media
      data:
        entity_id: "${media_player_entity}"
        media_id: !lambda "return media_id.c_str();"
        media_type: playlist
        enqueue: replace
  - delay: 1500ms
  - lambda: lv_obj_fade_out(id(lv_mood_overlay), 500, 0);
  - delay: 600ms
  - lvgl.widget.hide: lv_mood_overlay
  - globals.set:
      id: switching_playlist
      value: 'false'
output:
- platform: ledc
  pin: GPIO21
  id: backlight_pwm
light:
- platform: monochromatic
  output: backlight_pwm
  name: Display Backlight
  id: backlight
  restore_mode: ALWAYS_ON
spi:
- id: tft
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12
- id: touch
  clk_pin: GPIO25
  mosi_pin: GPIO32
  miso_pin: GPIO39
text_sensor:
- platform: homeassistant
  id: mp_state
  name: Player State
  entity_id: "${media_player_entity}"
  on_value:
    then:
    - lambda: id(media_active) = (x == "playing" || x == "paused");
    - if:
        condition:
          lambda: return x == "playing" || x == "paused";
        then:
        - script.stop: idle_sleep_timer
        - lvgl.resume: null
        - if:
            condition:
              lambda: return x == "playing";
            then:
            - light.turn_on:
                id: backlight
                brightness: 100%
            - globals.set:
                id: is_dimmed
                value: 'false'
            else:
            - light.turn_on: backlight
        - globals.set:
            id: is_sleeping
            value: 'false'
        - lvgl.page.show: canvas_1
        else:
        - if:
            condition:
              lambda: return !id(switching_playlist);
            then:
            - lvgl.page.show: canvas_idle
            - script.execute: idle_sleep_timer
    - if:
        condition:
          lambda: return x == "playing";
        then:
        - lvgl.image.update:
            id: lv_play_icon
            src: icon_pause
        else:
        - lvgl.image.update:
            id: lv_play_icon
            src: icon_play
    - if:
        condition:
          lambda: return x == "unavailable" || x == "unknown" || x.empty();
        then:
        - lvgl.widget.show: lv_player_not_found_msg
        else:
        - lvgl.widget.hide: lv_player_not_found_msg
- platform: homeassistant
  id: mp_title
  name: Player Title
  entity_id: "${media_player_entity}"
  attribute: media_title
  on_value:
    then:
    - lvgl.label.update:
        id: lv_song_title
        text:
          format: '%s'
          args:
          - x.c_str()
- platform: homeassistant
  id: mp_picture
  entity_id: "${media_player_entity}"
  attribute: entity_picture
  internal: true
  on_value:
  - if:
      condition:
        lambda: return !x.empty();
      then:
      - script.execute: fetch_cover
- platform: homeassistant
  id: mp_artist
  name: HA Media Artist
  entity_id: "${media_player_entity}"
  attribute: media_artist
  on_value:
    then:
    - lvgl.label.update:
        id: lv_artist_name
        text:
          format: '%s'
          args:
          - x.c_str()
sensor:
- platform: homeassistant
  id: mp_volume
  entity_id: "${media_player_entity}"
  attribute: volume_level
- platform: template
  name: Heap Free
  unit_of_measurement: B
  accuracy_decimals: 0
  entity_category: diagnostic
  update_interval: 30s
  lambda: return heap_caps_get_free_size(MALLOC_CAP_8BIT);
- platform: template
  name: Heap Min Free
  unit_of_measurement: B
  accuracy_decimals: 0
  entity_category: diagnostic
  update_interval: 30s
  lambda: return heap_caps_get_minimum_free_size(MALLOC_CAP_8BIT);
- platform: template
  name: Heap Largest Block
  unit_of_measurement: B
  accuracy_decimals: 0
  entity_category: diagnostic
  update_interval: 30s
  lambda: return heap_caps_get_largest_free_block(MALLOC_CAP_8BIT);
interval:
- interval: 30s
  then:
  - if:
      condition:
        lambda: return !id(vol_mode) && !isnan(id(mp_volume).state);
      then:
      - lvgl.slider.update:
          id: lv_vol_slider
          value: !lambda "return (int)(id(mp_volume).state * 100.0f);"
cover_art:
  id: cover
  container: lv_cover_box
  url: "${ha_url}/api/camera_proxy/${cover_camera_entity}?width=240&height=240"
  authorization: !secret ha_token
  height: 195
  fit: scale
  dither: true
  pixel_size: 1
select:
- platform: template
  name: Cover Pixel Size
  icon: mdi:grid
  entity_category: config
  optimistic: true
  restore_value: true
  initial_option: '1'
  options:
  - '1'
  - '2'
  - '3'
  - '4'
  - '5'
  - '6'
  - '8'
  - '10'
  - '12'
  on_value:
  - lambda: id(cover).set_pixel_size(atoi(x.c_str()));
  - cover_art.fetch: cover
button:
- platform: template
  name: Cover Test Pattern
  entity_category: diagnostic
  on_press:
  - cover_art.test_pattern: cover
- platform: template
  name: Cover Reload
  entity_category: diagnostic
  on_press:
  - cover_art.fetch: cover
color:
- id: COLOR_WHITE
  red: 100%
  green: 100%
  blue: 100%
- id: COLOR_BLACK
  red: 0%
  green: 0%
  blue: 0%
display:
- platform: ili9xxx
  id: cyd_display
  color_order: rgb
  model: ILI9341
  spi_id: tft
  cs_pin: GPIO15
  dc_pin: GPIO2
  invert_colors: false
  transform:
    swap_xy: true
    mirror_x: true
    mirror_y: true
  dimensions:
    width: 240
    height: 320
touchscreen:
  platform: xpt2046
  id: my_touchscreen
  spi_id: touch
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  calibration:
    x_min: 270
    x_max: 3747
    y_min: 324
    y_max: 3757
  transform:
    swap_xy: false
    mirror_x: true
    mirror_y: false
  on_touch:
  - script.execute: idle_dim_timer
  - if:
      condition:
        lambda: return id(is_dimmed);
      then:
      - light.turn_on:
          id: backlight
          brightness: 100%
      - globals.set:
          id: is_dimmed
          value: 'false'
  - if:
      condition:
        lambda: return id(is_sleeping);
      then:
      - switch.turn_off: switch_antiburn
      - lvgl.resume: null
      - lvgl.widget.redraw: null
      - light.turn_on: backlight
      - globals.set:
          id: is_sleeping
          value: 'false'
      - script.execute: idle_sleep_timer
      else:
      - if:
          condition: lvgl.is_paused
          then:
          - switch.turn_off: switch_antiburn
          - lvgl.resume: null
          - lvgl.widget.redraw: null
lvgl:
  displays:
  - cyd_display
  touchscreens:
  - my_touchscreen
  buffer_size: 10%
  color_depth: 16
  theme:
    label:
      text_color: 16777215
    obj:
      border_width: 0
      radius: 0
      shadow_width: 0
      outline_width: 0
    button:
      bg_color: 0
      text_color: 16777215
      border_width: 2
      border_color: 3355443
      radius: 0
      shadow_width: 0
      outline_width: 0
      scroll_on_focus: true
      pressed:
        bg_color: 2236962
        bg_opa: COVER
  style_definitions:
  - id: icon_bright
    image_recolor: 16777215
    image_recolor_opa: COVER
  - id: icon_dim
    image_recolor: 3815994
    image_recolor_opa: COVER
  pages:
